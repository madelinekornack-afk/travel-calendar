<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Calendar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%23FBF8F3' stroke='%232E2A26' stroke-width='2'/%3E%3Cpath d='M3 9a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v4H3z' fill='%23C8664A'/%3E%3Crect x='9' y='2' width='2.5' height='6' rx='1.2' fill='%232E2A26'/%3E%3Crect x='20.5' y='2' width='2.5' height='6' rx='1.2' fill='%232E2A26'/%3E%3Cg fill='%232E2A26'%3E%3Crect x='8' y='17' width='4' height='3' rx='.8'/%3E%3Crect x='14' y='17' width='4' height='3' rx='.8'/%3E%3Crect x='20' y='17' width='4' height='3' rx='.8'/%3E%3Crect x='8' y='22.5' width='4' height='3' rx='.8'/%3E%3Crect x='14' y='22.5' width='4' height='3' rx='.8' fill='%23C8664A'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <style>
    /* Paper planner: cream paper, hairline rules, flat ink colours. */
    :root {
      --paper: #FBF8F3;
      --paper-dim: #F3EEE5;
      --line: #E6DFD3;
      --ink: #2E2A26;
      --ink-soft: #6F665B;
      --muted: #A39886;
      --madeline: #C8664A;
      --phil: #3F7F8C;
      --both: #7A5C99;
      /* Maxinomics colors mean the kind of entry, not who it's for. */
      --longform: #C8664A;
      --short: #D9A441;
      --shoot: #3F7F8C;
      --event: #7A5C99;
      --ad: #6B8E4E;
      --serif: 'Fraunces', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop: locked to viewport */
    @media (min-width: 769px) {
      body { height: 100vh; overflow: hidden; }
      .container { height: 100vh; overflow: hidden; }
    }

    .container {
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 28px 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .header h1 .year { color: var(--muted); font-weight: 400; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .couple {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
    }

    /* Two calendars, one page: a segmented toggle in the header. */
    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      background: var(--paper-dim);
    }

    .tabs button {
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tabs button:hover { color: var(--ink); }

    .tabs button.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 0 0 1px var(--line);
    }

    .nav-buttons { display: flex; gap: 6px; }

    .nav-buttons button {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      height: 30px;
      min-width: 30px;
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-buttons button:hover { background: var(--paper-dim); color: var(--ink); }

    .calendar-wrapper {
      flex: 1;
      overflow: hidden;
      padding: 0 28px 4px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .month-view {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      flex-shrink: 0;
    }

    .weekday {
      text-align: left;
      padding: 0 8px 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mobile-weekday-bar { display: none; }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      flex: 1;
      min-height: 0;
      position: relative;
      border-top: 1px solid var(--line);
    }

    .week-grid:last-child { border-bottom: 1px solid var(--line); }

    .multi-day-event {
      position: absolute;
      height: 22px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      color: #fff;
      transition: filter 0.15s;
    }

    .multi-day-event:hover { filter: brightness(0.92); }

    /* One color per key, shared by bars, legend swatches and chip dots. */
    :is(.trip-badge, .legend-swatch, .chip .dot).madeline { background: var(--madeline); }
    :is(.trip-badge, .legend-swatch, .chip .dot).fiance { background: var(--phil); }
    :is(.trip-badge, .legend-swatch, .chip .dot).both { background: var(--both); }
    :is(.trip-badge, .legend-swatch, .chip .dot).longform { background: var(--longform); }
    :is(.trip-badge, .legend-swatch, .chip .dot).short { background: var(--short); }
    :is(.trip-badge, .legend-swatch, .chip .dot).shoot { background: var(--shoot); }
    :is(.trip-badge, .legend-swatch, .chip .dot).event { background: var(--event); }
    :is(.trip-badge, .legend-swatch, .chip .dot).ad { background: var(--ad); }

    /* Added without a color yet: an outlined bar, filled in once someone picks who it's for. */
    .trip-badge.unset {
      background: var(--paper);
      color: var(--ink);
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }

    /* Days being swept with the mouse to make a multi-day entry. */
    .day.picking { background: #EFE3D3 !important; }

    .day {
      padding: 6px 8px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 50px;
      transition: background 0.15s;
    }

    .day ~ .day { border-left: 1px solid var(--line); }

    /* The month in the heading sits on the paper; the months either side are a shade darker. */
    .day.in-month { background: var(--paper); }
    .day.other-month { background: var(--paper-dim); }
    .day.other-month .day-number { color: var(--muted); }
    .day:hover { background: #F6EFE4; }

    .day-number {
      font-size: 13px;
      font-weight: 500;
      line-height: 22px;
      height: 22px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .day.today .day-number .num {
      background: var(--madeline);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: -4px;
    }

    /* A box around today's square, drawn on top so entries don't hide it. */
    .day.today::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--madeline);
      pointer-events: none;
      z-index: 3;
    }

    .month-label {
      font-family: var(--serif);
      font-style: italic;
      font-size: 13px;
      font-weight: 500;
      color: var(--madeline);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(46, 42, 38, 0.35);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--paper);
      padding: 24px;
      border-radius: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(46, 42, 38, 0.18);
      width: 90%;
      max-width: 420px;
    }

    .modal-content h3 {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--ink-soft);
    }

    .form-buttons { display: flex; gap: 8px; margin-top: 18px; }

    .form-buttons button {
      flex: 1;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
    .btn-primary:hover { background: #47413B; }
    .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-secondary:hover { background: var(--paper-dim); }
    .btn-danger { background: transparent; color: #A33A2A; border: 1px solid #E5C2BA; }
    .btn-danger:hover { background: #F7E7E2; }

    .loading { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

    .error, .success {
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .error { background: #F7E7E2; color: #8A2E20; }
    .success { background: #E6EFE9; color: #2F5E46; }

    .legend {
      display: flex;
      gap: 18px;
      padding: 10px 28px 14px;
      align-items: center;
      font-size: 12px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
    .legend-swatch.unset,
    .chip .dot.unset { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--muted); }

    .date-row { display: flex; gap: 10px; }
    .date-row .form-group { flex: 1; }

    /* Color chips: pick who an entry is for with one click. */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink-soft);
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--muted); color: var(--ink); }
    .chip.selected { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ===== Goals (Personal tab) ===== */
    .goals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding-bottom: 12px; flex-shrink: 0; }
    .goals:empty { display: none; }
    .goal {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .goal-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-soft); }
    .goal-top .pace { font-size: 11px; font-weight: 600; color: var(--phil); }
    .goal.behind .pace, .goal.behind .goal-bal { color: var(--madeline); }
    .goal-bal { font-family: var(--serif); font-size: 24px; font-weight: 500; line-height: 1.15; }
    .goal-sub { font-size: 12px; color: var(--muted); }
    .goal-bal small { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; color: var(--muted); }
    .goal.focus .pace { color: var(--ink-soft); font-weight: 500; }
    .goal-left { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
    .focus-input {
      font: inherit;
      color: inherit;
      width: 4.2ch;
      padding: 0;
      border: none;
      border-bottom: 1.5px dashed var(--muted);
      background: transparent;
      cursor: text;
    }
    .focus-input:hover, .focus-input:focus { outline: none; border-bottom: 1.5px solid var(--ink); }
    .edit-mark { font-size: 13px; color: var(--muted); margin-left: 3px; }
    .goal-add { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
    .goal-add button, .goals-unlock {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink-soft);
      border-radius: 999px;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .goal-add button:hover, .goals-unlock:hover { border-color: var(--muted); color: var(--ink); }
    .goal-add button.done { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .goals-unlock { justify-self: start; grid-column: 1 / -1; }

    /* What got logged on a day: icons beside the date, top left. */
    .day-marks { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; pointer-events: none; }
    .log-icon { font-size: 17px; line-height: 1; display: inline-flex; align-items: baseline; }
    .log-icon small { font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-left: 1px; }

    /* Log steppers at the top of a day's box. */
    .day-log { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .day-log h3 { margin-bottom: 8px !important; }
    .log-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 14px; }
    .stepper { display: inline-flex; align-items: center; gap: 8px; }
    .stepper button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: default; }
    .stepper b { min-width: 14px; text-align: center; font-weight: 600; }
    .stepper input {
      width: 46px;
      padding: 3px 4px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      text-align: center;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
      }

      .container { height: auto; overflow: visible; display: block; }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 8px 12px;
        background: var(--paper);
        justify-content: center;
      }

      .header h1, .header-right { display: none; }

      /* Fixed weekday bar on mobile */
      .mobile-weekday-bar {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr);
        position: fixed;
        top: 48px;
        left: 0;
        right: 0;
        z-index: 99;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }

      .mobile-weekday-bar .weekday { text-align: center; padding: 2px 0; font-size: 10px; }

      .calendar-wrapper {
        overflow: visible !important;
        flex: none !important;
        padding: 78px 0 0 !important;
        display: block;
        height: auto !important;
      }

      .month-view { height: auto !important; display: block; }
      .month-view .weekdays { display: none; }

      .week-grid {
        flex: none !important;
        min-height: auto !important;
        grid-auto-rows: 80px;
      }

      .multi-day-event {
        height: 18px !important;
        font-size: 10px !important;
        padding: 0 5px !important;
        border-radius: 3px;
      }

      .day { height: 80px; min-height: 80px; padding: 3px 4px; overflow: hidden; }
      .day-number { font-size: 12px; height: 18px; line-height: 18px; }
      .day.today .day-number .num { width: 18px; height: 18px; margin-left: -2px; }
      .month-label { font-size: 11px; }

      .legend { padding: 10px 12px 14px; gap: 12px; font-size: 11px; }
      .goals { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px 10px 10px; }
      .goal-bal { font-size: 20px; }
      .day-marks { gap: 1px; margin-left: 2px; }
      .log-icon { font-size: 11px; }
      .log-icon small { font-size: 8px; }
      .modal-content { width: 95%; padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="mobile-weekday-bar">
    <div class="weekday">Mon</div>
    <div class="weekday">Tue</div>
    <div class="weekday">Wed</div>
    <div class="weekday">Thu</div>
    <div class="weekday">Fri</div>
    <div class="weekday">Sat</div>
    <div class="weekday">Sun</div>
  </div>
  <div class="container">
    <div class="header">
      <h1 id="monthTitle"></h1>
      <div class="tabs" role="tablist">
        <button role="tab" data-calendar="personal" onclick="switchCalendar('personal')">Personal</button>
        <button role="tab" data-calendar="maxinomics" onclick="switchCalendar('maxinomics')">Maxinomics</button>
      </div>
      <div class="header-right">
        <span class="couple">Maddy &amp; Phil</span>
        <div class="nav-buttons">
          <button onclick="previousMonth()" aria-label="Previous week">←</button>
          <button onclick="currentMonth()">Today</button>
          <button onclick="nextMonth()" aria-label="Next week">→</button>
        </div>
      </div>
    </div>

    <div class="calendar-wrapper">
      <div class="goals" id="goals"></div>
      <div id="message"></div>
      <div id="calendar" class="month-view">
        <div class="loading">Loading calendar...</div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- Add/Edit Trip Modal -->
  <div id="tripModal" class="modal">
    <div class="modal-content">
      <div class="day-log" id="dayLog">
        <h3 id="dayLogTitle"></h3>
        <div class="hint" style="margin:-4px 0 8px">Saves as you tap.</div>
        <div id="dayLogRows"></div>
      </div>
      <h3 id="modalTitle">Add</h3>
      <form id="tripForm" onsubmit="saveTrip(event)">
        <div class="form-group">
          <label for="tripName">What</label>
          <input type="text" id="tripName" autocomplete="off" placeholder="Hawaii, dentist, launch day">
        </div>

        <div class="date-row">
          <div class="form-group">
            <label for="tripStartDate">From</label>
            <input type="date" id="tripStartDate" required>
          </div>
          <div class="form-group">
            <label for="tripEndDate">To</label>
            <input type="date" id="tripEndDate" required>
          </div>
        </div>

        <div class="form-group">
          <label>Color <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <input type="hidden" id="tripPerson">
          <div class="chips" id="colorChips"></div>
          <div class="hint" id="colorHint"></div>
        </div>

        <div class="form-group">
          <label for="tripCalendar">Calendar</label>
          <select id="tripCalendar">
            <option value="personal">Personal</option>
            <option value="maxinomics">Maxinomics</option>
          </select>
        </div>

        <div id="formError"></div>

        <div class="form-buttons">
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="button" id="deleteBtn" class="btn-danger" onclick="deleteTrip()" style="display: none;">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0/+esm';

    const SUPABASE_URL = 'https://lcfnmxufyipclcfpteqz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZm5teHVmeWlwY2xjZnB0ZXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODc1NjEsImV4cCI6MjA4Nzk2MzU2MX0.r-QcVdtX7gTVrKY3ue2OmMm13Nvh2rhvAN2nQ-Uhjv4';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Reading trips is public. Changing them is not: the RLS policies on `trips`
    // require an `x-trip-key` header matching the edit passphrase, so the anon key
    // on its own (which anyone can read off this page) can no longer add, edit or
    // delete anything. The passphrase is kept in this browser only.
    const TRIP_KEY_STORAGE = 'tripEditKey';
    let writeClient = null;
    let writeClientKey = null;

    function getWriteClient({ prompt = true } = {}) {
      let key = localStorage.getItem(TRIP_KEY_STORAGE);
      if (!key && prompt) {
        key = (window.prompt('Enter the edit passphrase:') || '').trim();
        if (!key) return null;
        localStorage.setItem(TRIP_KEY_STORAGE, key);
      }
      if (!key) return null;
      if (!writeClient || writeClientKey !== key) {
        writeClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: { headers: { 'x-trip-key': key } },
        });
        writeClientKey = key;
      }
      return writeClient;
    }

    // A wrong passphrase makes UPDATE and DELETE return 200 with zero rows rather
    // than an error, so every write asks for the affected rows back and treats an
    // empty result as a rejected passphrase instead of silently "succeeding".
    function rejectBadKey() {
      localStorage.removeItem(TRIP_KEY_STORAGE);
      writeClient = null;
      writeClientKey = null;
      throw new Error('That edit passphrase was not accepted. Try again.');
    }

    // Which calendar is showing. A #maxinomics or #personal link opens that
    // tab; otherwise the page reopens on the tab used last.
    const CALENDARS = ['personal', 'maxinomics'];
    const TAB_STORAGE = 'calendarTab';
    let activeCalendar = (() => {
      const fromHash = location.hash.slice(1);
      if (CALENDARS.includes(fromHash)) return fromHash;
      try {
        const saved = localStorage.getItem(TAB_STORAGE);
        if (CALENDARS.includes(saved)) return saved;
      } catch {}
      return 'personal';
    })();

    // Each tab has its own colors. Personal colors say who an entry is for;
    // Maxinomics colors say what kind of entry it is. The key is stored in
    // trips.created_by. To add a color: add a line here and a CSS variable.
    const COLORS = {
      personal: [['madeline', 'Madeline'], ['fiance', 'Phil'], ['both', 'Both']],
      maxinomics: [['longform', 'Long form'], ['short', 'Short'], ['shoot', 'Shoot'],
                   ['event', 'Event'], ['ad', 'Advertisement']],
    };

    function renderColorChips(calendar) {
      document.getElementById('colorChips').innerHTML = [['', 'None'], ...COLORS[calendar]]
        .map(([key, label]) => `<button type="button" class="chip" data-person="${key}"><span class="dot ${key || 'unset'}"></span>${label}</button>`)
        .join('');
    }

    function renderLegend() {
      document.getElementById('legend').innerHTML = [...COLORS[activeCalendar], ['unset', 'No color yet']]
        .map(([key, label]) => `<div class="legend-item"><div class="legend-swatch ${key}"></div> ${label}</div>`)
        .join('');
    }

    // ===== Goals =====
    // goal_logs holds one row per day and kind, with a count (two meditations
    // in a day is count 2; a half workout is 0.5). Reading it needs the edit
    // passphrase too.
    const LOG_KINDS = [
      ['strength_upper', 'Strength · upper', '💪', 'Upper'],
      ['strength_lower', 'Strength · lower', '🦵', 'Lower'],
      ['workout', 'Run', '🏃', 'Run'],      // stored as 'workout'; it was named that first
      ['yoga', 'Yoga', '🤸', 'Yoga'],
      ['meditation', 'Meditation', '🧘', 'Meditate'],
      ['nosocial', 'No social media', '📵', 'No social'],
    ];
    let goalLogs = {};       // { 'YYYY-MM-DD': { strength_upper: 1, workout: 0.5, ... } }
    let goalsUnlocked = false;

    // Each goal accumulates over the year: the balance is what's done minus
    // what's due, so a big week covers a light one. `through` and `start` are
    // where the paper calendar left off (the balance at the end of that day).
    // Workouts are strength (upper or lower), runs and yoga.
    const strength = l => (l.strength_upper || 0) + (l.strength_lower || 0);
    const GOALS = [
      { label: 'Strength', per: 'week', target: 2, through: '2026-10-31', start: 9,
        count: strength, buttons: [['strength_upper', '+ Upper'], ['strength_lower', '+ Lower']] },
      { label: 'Workouts', per: 'week', target: 4.5, through: '2026-10-31', start: 14,
        count: l => strength(l) + (l.workout || 0) + (l.yoga || 0), buttons: [['workout', '+ Run'], ['yoga', '+ Yoga']] },
      // Half the days of the year. 157 days done by Oct 31 (day 304 of the year).
      { label: 'No social media', per: 'day', target: 0.5, through: '2026-10-31', start: 157 - 304 / 2,
        startTotal: 157, count: l => l.nosocial || 0, buttons: [['nosocial', 'Today']] },
      // 96 meditations by Oct 31, against 10 a month for ten months.
      { label: 'Meditation', per: 'month', target: 10, through: '2026-10-31', start: 96 - 100,
        startTotal: 96, count: l => l.meditation || 0, buttons: [['meditation', '+ Meditation']] },
    ];

    function addDays(dateStr, n) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return toLocalDateStr(d);
    }

    // The period holding a date. Goal weeks run Sunday to Saturday, as on paper.
    function periodOf(per, dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      if (per === 'day') return [dateStr, dateStr];
      if (per === 'week') return [addDays(dateStr, -d.getDay()), addDays(dateStr, 6 - d.getDay())];
      const first = toLocalDateStr(new Date(d.getFullYear(), d.getMonth(), 1));
      return [first, toLocalDateStr(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
    }

    // Weekly and monthly cards show where she'll stand when the period ends
    // if she does no more: "−6 by Nov 30" means six more this month to be even.
    function periodEndLabel(per, today) {
      const end = new Date(periodOf(per, today)[1] + 'T12:00:00');
      return end.toLocaleDateString('en-US', per === 'week' ? { weekday: 'short' } : { month: 'short', day: 'numeric' });
    }

    // A goal year holds whole periods. A week belongs to the year its Saturday
    // falls in: 2026 began with the Thu Jan 1 – Sat Jan 3 week counted as full,
    // so the Sun Dec 27 – Sat Jan 2 week belongs to 2027, not 2026.
    function goalYear(per, today) {
      const year = periodOf(per, today)[1].slice(0, 4);
      const [lastStart, lastEnd] = periodOf(per, year + '-12-31');
      return [periodOf(per, year + '-01-01')[0], lastEnd.slice(0, 4) === year ? lastEnd : addDays(lastStart, -1)];
    }

    function doneBetween(goal, from, to) {
      let n = 0;
      for (let d = from; d <= to; d = addDays(d, 1)) n += goal.count(goalLogs[d] || {});
      return n;
    }

    // Balance over finished periods (the paper number), plus the current period.
    // A new year starts every goal again at zero.
    function goalStatus(goal) {
      const today = toLocalDateStr(new Date());
      const [yearStart, yearEnd] = goalYear(goal.per, today);
      const fromPaper = goal.through >= yearStart;
      const from = fromPaper ? addDays(goal.through, 1) : yearStart;
      let balance = fromPaper ? goal.start : 0;
      let [ps, pe] = periodOf(goal.per, from);
      let done = 0;
      for (; ps <= today; [ps, pe] = periodOf(goal.per, addDays(pe, 1))) {
        done = doneBetween(goal, ps < from ? from : ps, pe < today ? pe : today);
        if (pe < today) balance += done - goal.target;
      }
      // On track if what's done so far keeps up with what's due so far this period.
      [ps, pe] = periodOf(goal.per, today);
      const len = Math.round((new Date(pe) - new Date(ps)) / 864e5) + 1;
      const elapsed = Math.round((new Date(today) - new Date(ps)) / 864e5);
      const onTrack = balance + done - goal.target * elapsed / len >= 0;
      const total = (fromPaper ? goal.startTotal || 0 : 0) + doneBetween(goal, from, today);
      // Still to do this year: what every period left (this one included)
      // asks for, less the surplus and what's done this period already.
      let periodsLeft = 0;
      for (let p = ps; p <= yearEnd; p = addDays(periodOf(goal.per, p)[1], 1)) periodsLeft++;
      const left = Math.max(0, goal.target * periodsLeft - balance - done);
      return { balance, done, onTrack, total, left, yearEnd };
    }

    // +11.5 reads as +11½, the way it's written on paper.
    function fmtBalance(n) {
      const sign = n > 0 ? '+' : n < 0 ? '−' : '';
      const a = Math.abs(n);
      const whole = Math.floor(a);
      return sign + (a % 1 ? (whole || '') + '½' : whole);
    }
    const fmtCount = n => n % 1 ? (Math.floor(n) || '') + '½' : String(n);

    function renderGoals() {
      const el = document.getElementById('goals');
      // Don't redraw under someone typing a focus total.
      if (document.activeElement?.classList.contains('focus-input')) return;
      if (activeCalendar !== 'personal') { el.innerHTML = ''; return; }
      if (!goalsUnlocked) {
        el.innerHTML = '<button class="goals-unlock" onclick="unlockGoals()">Show goals</button>';
        return;
      }
      const today = toLocalDateStr(new Date());
      const todayLog = goalLogs[today] || {};
      el.innerHTML = GOALS.map(goal => {
        const s = goalStatus(goal);
        const sub = goal.per === 'week' ? `This week: ${fmtCount(s.done)} of ${fmtCount(goal.target)}`
          : goal.per === 'month' ? `${new Date().toLocaleDateString('en-US', { month: 'long' })}: ${fmtCount(s.done)} of ${goal.target} · ${fmtCount(s.total)} this year`
          : `${s.total} days this year`;
        const buttons = goal.buttons.map(([kind, label]) => {
          const done = kind === 'nosocial' && todayLog.nosocial;
          return `<button class="${done ? 'done' : ''}" onclick="logToday('${kind}')">${done ? '✓ Today' : label}</button>`;
        }).join('');
        return `
          <div class="goal ${s.onTrack ? '' : 'behind'}">
            <div class="goal-top"><span>${goal.label}</span><span class="pace">${s.onTrack ? 'On track' : 'Behind'}</span></div>
            <div class="goal-bal">${goal.per === 'day' ? fmtBalance(s.balance)
              : `${fmtBalance(s.balance + s.done - goal.target)} <small>by ${periodEndLabel(goal.per, today)}</small>`}</div>
            <div class="goal-sub">${sub}</div>
            <div class="goal-left">${s.left ? `${goal.per === 'day' ? Math.ceil(s.left) + ' days' : fmtCount(Math.ceil(s.left * 2) / 2)} to go by ${new Date(s.yearEnd + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : 'Year goal covered'}</div>
            <div class="goal-add">${buttons}</div>
          </div>`;
      }).join('') + focusCard();
    }

    // ===== Focus hours =====
    // Forest keeps the real number, so she types her running total in; the
    // card works out how much a day it takes to reach the goal by Dec 31.
    const FOCUS_GOAL = 1200;
    let focusTotal = null;   // latest total typed in this year, in hours

    function fmtHm(h) {
      let m = Math.round(h * 60);
      return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m`;
    }

    // Days from tomorrow through the given day of December, never counting today.
    function daysUntil(monthDay) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((new Date(now.getFullYear() + '-' + monthDay + 'T00:00:00') - today) / 864e5);
    }

    function focusCard() {
      const left = FOCUS_GOAL - (focusTotal || 0);
      const daysToEnd = daysUntil('12-31');
      const daysToDec20 = daysUntil('12-20');
      let sub, leftLine;
      if (focusTotal === null) { sub = 'Type your Forest total above'; leftLine = ''; }
      else if (left <= 0) { sub = 'Goal reached'; leftLine = 'Year goal covered'; }
      else {
        sub = `${fmtHm(left / Math.max(daysToEnd, 1))} a day to finish`
          + (daysToDec20 > 0 ? ` · ${fmtHm(left / daysToDec20)} by Dec 20` : '');
        leftLine = `${fmtHm(left).replace(/h00m$/, 'h')} to go by Dec 31`;
      }
      const shown = focusTotal === null ? '' : String(Math.round(focusTotal * 100) / 100);
      // The total is an input styled as the big number: click it, type, Enter.
      return `
        <div class="goal focus">
          <div class="goal-top"><span>Focus hours</span><span class="pace">${daysToEnd} days left</span></div>
          <div class="goal-bal"><input class="focus-input" value="${shown}" placeholder="—" inputmode="decimal"
            title="Click to type your Forest total" aria-label="Focus hours so far this year"
            onchange="saveFocus(this.value)" onkeydown="if (event.key === 'Enter') this.blur()"><span class="edit-mark">✎</span> <small>of ${FOCUS_GOAL.toLocaleString()}</small></div>
          <div class="goal-sub">${sub}</div>
          <div class="goal-left">${leftLine}</div>
        </div>`;
    }

    // Takes 1022, 1022.5, 1022:30 or 1022h30m.
    function parseHours(text) {
      const m = String(text).trim().match(/^(\d+(?:\.\d+)?)\s*(?:h|:)?\s*(?:(\d+)\s*m?)?$/i);
      return m ? Number(m[1]) + (m[2] ? Number(m[2]) / 60 : 0) : null;
    }

    window.saveFocus = async (text) => {
      const hours = parseHours(String(text).replace(/,/g, ''));
      if (hours === null || hours === focusTotal) { renderGoals(); return; }
      const db = getWriteClient();
      if (!db) return;
      try {
        const { data, error } = await db.from('focus_hours')
          .insert({ recorded_on: toLocalDateStr(new Date()), hours: Math.round(hours * 100) / 100 }).select();
        if (error) throw error;
        if (!data.length) rejectBadKey();
        focusTotal = hours;
        renderGoals();
      } catch (error) {
        console.error('Error saving focus hours:', error);
        showMessage('Error: ' + error.message, 'error');
      }
    };

    function dayMarks(dateStr) {
      const log = goalLogs[dateStr];
      if (!log || activeCalendar !== 'personal') return '';
      return LOG_KINDS.filter(([kind]) => log[kind]).map(([kind, label, icon]) => {
        const n = log[kind];
        const amount = n === 1 ? '' : n === 0.5 ? '½' : `×${fmtCount(n)}`;
        return `<span class="log-icon" title="${label}${amount ? ' ' + amount : ''}">${icon}${amount ? `<small>${amount}</small>` : ''}</span>`;
      }).join('');
    }

    async function fetchGoalLogs() {
      const db = getWriteClient({ prompt: false });
      if (!db) { goalsUnlocked = false; return; }
      // This year counts toward the goals; last year still shows on the calendar.
      const { data, error } = await db.from('goal_logs').select('day,kind,count')
        .gte('day', (new Date().getFullYear() - 1) + '-01-01').range(0, 9999);
      if (error) { console.error('Error fetching goals:', error); return; }
      goalLogs = {};
      data.forEach(r => { (goalLogs[r.day] ||= {})[r.kind] = Number(r.count); });
      goalsUnlocked = true;

      const { data: focus } = await db.from('focus_hours').select('hours')
        .gte('recorded_on', new Date().getFullYear() + '-01-01')
        .order('recorded_on', { ascending: false }).order('created_at', { ascending: false }).limit(1);
      focusTotal = focus && focus.length ? Number(focus[0].hours) : null;
    }

    window.unlockGoals = async () => {
      if (!getWriteClient()) return;
      await fetchGoalLogs();
      renderGoals();
      renderCalendar();
    };

    async function setLog(day, kind, count) {
      const db = getWriteClient();
      if (!db) return;
      // Counts go in halves: 1 by default, 0.5 for a half workout.
      count = Math.max(0, Math.round((kind === 'nosocial' ? Math.min(count, 1) : count) * 2) / 2);
      try {
        const { data, error } = count
          ? await db.from('goal_logs').upsert({ day, kind, count, updated_at: new Date().toISOString() }).select()
          : await db.from('goal_logs').delete().eq('day', day).eq('kind', kind).select();
        if (error) throw error;
        if (count && !data.length) rejectBadKey();
        const log = (goalLogs[day] ||= {});
        if (count) log[kind] = count; else delete log[kind];
        goalsUnlocked = true;
        renderGoals();
        renderCalendar();
        if (document.getElementById('dayLog').dataset.day === day) renderDayLog(day);
      } catch (error) {
        console.error('Error saving goal log:', error);
        showMessage('Error: ' + error.message, 'error');
      }
    }

    // The buttons on the goal cards log for today. No social media is a
    // yes/no for the day, so its button toggles.
    window.logToday = (kind) => {
      const today = toLocalDateStr(new Date());
      const n = (goalLogs[today] || {})[kind] || 0;
      setLog(today, kind, kind === 'nosocial' ? (n ? 0 : 1) : n + 1);
    };

    function renderDayLog(day) {
      const box = document.getElementById('dayLog');
      box.dataset.day = day;
      document.getElementById('dayLogTitle').textContent =
        new Date(day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const log = goalLogs[day] || {};
      document.getElementById('dayLogRows').innerHTML = LOG_KINDS.map(([kind, label, icon]) => {
        const n = log[kind] || 0;
        const max = kind === 'nosocial' ? 1 : 99;
        // The number is typeable, so a half workout is "+" then 0.5.
        const value = kind === 'nosocial' ? `<b>${n}</b>`
          : `<input type="number" inputmode="decimal" min="0" step="0.5" data-kind="${kind}" value="${n}" aria-label="${label} count">`;
        return `<div class="log-row"><span>${icon} ${label}</span><span class="stepper">
          <button type="button" data-kind="${kind}" data-n="${Math.max(0, n - 1)}" ${n ? '' : 'disabled'} aria-label="Less">−</button>
          ${value}
          <button type="button" data-kind="${kind}" data-n="${n + 1}" ${n < max ? '' : 'disabled'} aria-label="More">+</button>
        </span></div>`;
      }).join('');
    }

    document.getElementById('dayLogRows').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) setLog(document.getElementById('dayLog').dataset.day, b.dataset.kind, Number(b.dataset.n));
    });
    document.getElementById('dayLogRows').addEventListener('change', (e) => {
      const input = e.target.closest('input');
      if (input) setLog(document.getElementById('dayLog').dataset.day, input.dataset.kind, Number(input.value) || 0);
    });

    // Save reads "Done" while there is only logging to finish.
    function syncSaveLabel() {
      const onlyLog = !document.getElementById('tripName').value.trim() && document.getElementById('dayLog').dataset.day;
      document.getElementById('saveBtn').textContent = onlyLog ? 'Done' : 'Save';
    }
    document.getElementById('tripName').addEventListener('input', syncSaveLabel);

    // A single day on the Personal tab opens with its log on top.
    function showDayLog(day) {
      const box = document.getElementById('dayLog');
      const show = day && goalsUnlocked && activeCalendar === 'personal';
      box.style.display = show ? '' : 'none';
      box.dataset.day = show ? day : '';
      if (show) renderDayLog(day);
      syncSaveLabel();
    }

    function markActiveTab() {
      document.querySelectorAll('.tabs button').forEach(b => {
        const on = b.dataset.calendar === activeCalendar;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on);
      });
    }

    window.switchCalendar = async (calendar) => {
      if (calendar === activeCalendar) return;
      activeCalendar = calendar;
      try { localStorage.setItem(TAB_STORAGE, calendar); } catch {}
      history.replaceState(null, '', '#' + calendar);
      markActiveTab();
      renderLegend();
      renderGoals();
      await fetchTrips();
      renderCalendar();
    };

    let currentDate = new Date();
    let trips = [];
    let selectedTrip = null;

    const mobileQuery = window.matchMedia('(max-width: 768px)');
    const isMobile = mobileQuery.matches;
    // The phone and desktop layouts set up different scroll handlers at load,
    // so reload when a resize or rotation crosses the breakpoint.
    mobileQuery.addEventListener('change', () => location.reload());

    window.previousMonth = () => {
      currentDate.setDate(currentDate.getDate() - 7);
      renderCalendar();
    };

    window.nextMonth = () => {
      currentDate.setDate(currentDate.getDate() + 7);
      renderCalendar();
    };

    window.currentMonth = () => {
      currentDate = new Date();
      renderCalendar();
    };

    async function fetchTrips() {
      try {
        const { data, error } = await supabase
          .from('trips')
          .select('*')
          .eq('calendar', activeCalendar)
          .order('start_date', { ascending: true });

        if (error) throw error;
        trips = data || [];
      } catch (error) {
        console.error('Error fetching trips:', error);
        showMessage('Error loading trips: ' + error.message, 'error');
      }
    }

    // Trip names are typed by people, so escape them before they go into innerHTML.
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function toLocalDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Mobile infinite scroll state
    let mobileWeeksBefore = 0;
    let mobileWeeksAfter = 8;

    function renderCalendar() {
      const date = new Date(currentDate);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);

      const startDate = new Date(date.setDate(diff));

      // The heading names the month of the top week's Thursday, so the
      // label turns over once most of the top row is in the new month.
      const focusDay = new Date(startDate);
      focusDay.setDate(focusDay.getDate() + 3);
      const focusMonth = focusDay.getMonth();
      document.getElementById('monthTitle').innerHTML =
        `${focusDay.toLocaleDateString('en-US', { month: 'long' })} <span class="year">${focusDay.getFullYear()}</span>`;

      let weeksToShow, weeksBefore;
      if (isMobile) {
        weeksToShow = mobileWeeksBefore + mobileWeeksAfter;
        weeksBefore = mobileWeeksBefore;
        startDate.setDate(startDate.getDate() - weeksBefore * 7);
      } else {
        weeksToShow = 5;
        weeksBefore = 0;
      }


      let html = `

        <div class="weekdays">
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
          <div class="weekday">Sun</div>
        </div>
      `;

      for (let week = 0; week < weeksToShow; week++) {
        const weekStart = new Date(startDate);
        weekStart.setDate(weekStart.getDate() + week * 7);

        const seenIds = new Set();
        const weekMultiDay = [];
        for (let d = 0; d < 7; d++) {
          const dd = new Date(weekStart);
          dd.setDate(dd.getDate() + d);
          const ds = toLocalDateStr(dd);
          trips.forEach(trip => {
            const start = trip.start_date.split('T')[0];
            const end = trip.end_date.split('T')[0];
            if (ds >= start && ds <= end && !seenIds.has(trip.id)) {
              seenIds.add(trip.id);
              weekMultiDay.push(trip);
            }
          });
        }
        weekMultiDay.sort((a, b) => {
          const cmp = a.start_date.split('T')[0].localeCompare(b.start_date.split('T')[0]);
          if (cmp !== 0) return cmp;
          return b.end_date.split('T')[0].localeCompare(a.end_date.split('T')[0]);
        });

        html += `<div class="week-grid">`;

        const weekDays = [];
        for (let d = 0; d < 7; d++) {
          const wd = new Date(weekStart);
          wd.setDate(wd.getDate() + d);
          weekDays.push(toLocalDateStr(wd));
        }

        // Spanning bars for both desktop and mobile
        const barRows = [];
        const mobileRowH = 22;
        const desktopRowH = 28;
        weekMultiDay.forEach(trip => {
          const start = trip.start_date.split('T')[0];
          const end = trip.end_date.split('T')[0];
          let startOffset = weekDays.findIndex(d => d >= start);
          if (startOffset === -1) startOffset = 0;
          let endOffset = 6;
          for (let i = 6; i >= 0; i--) {
            if (weekDays[i] <= end) { endOffset = i; break; }
          }
          const daysShown = endOffset - startOffset + 1;

          let row = 0;
          while (true) {
            if (!barRows[row]) { barRows[row] = []; break; }
            const conflict = barRows[row].some(b => startOffset <= b.end && endOffset >= b.start);
            if (!conflict) break;
            row++;
          }
          barRows[row] = barRows[row] || [];
          barRows[row].push({ start: startOffset, end: endOffset });

          const rowH = isMobile ? mobileRowH : desktopRowH;
          const topPx = (isMobile ? 22 : 32) + row * rowH;
          const cellWidth = (100 / 7);
          const left = cellWidth * startOffset;
          const width = cellWidth * daysShown;

          html += `
            <div class="multi-day-event trip-badge ${trip.created_by || 'unset'}" style="left: calc(${left}% + 4px); width: calc(${width}% - 8px); top: ${topPx}px;" onclick="event.stopPropagation(); editTrip('${trip.id}')">
              ${escapeHtml(trip.name)}
            </div>
          `;
        });

        for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + dayOffset);
          const dateStr = toLocalDateStr(dayDate);

          const dayNum = dayDate.getDate();
          const today = new Date();
          const todayStr = toLocalDateStr(today);
          const isToday = dateStr === todayStr ? 'today' : '';
          const thisMonth = dayDate.getMonth();
          const monthClass = thisMonth === focusMonth ? 'in-month' : 'other-month';

          const monthLabel = dayNum === 1 ? dayDate.toLocaleDateString('en-US', { month: 'short' }) : '';

          html += `
            <div class="day ${isToday} ${monthClass}" data-date="${dateStr}">
              <div class="day-number">${monthLabel ? '<span class="month-label">' + monthLabel + '</span>' : ''}<span class="num">${dayNum}</span><span class="day-marks">${dayMarks(dateStr)}</span></div>
            </div>
          `;
        }
        html += `</div>`;
      }

      document.getElementById('calendar').innerHTML = html;
    }

    window.editTrip = (tripId) => {
      const trip = trips.find(t => t.id === tripId);
      if (!trip) return;

      selectedTrip = trip;
      document.getElementById('modalTitle').textContent = 'Edit';
      document.getElementById('tripName').value = trip.name;
      document.getElementById('tripStartDate').value = trip.start_date.split('T')[0];
      document.getElementById('tripEndDate').value = trip.end_date.split('T')[0];
      document.getElementById('tripCalendar').value = trip.calendar;
      renderColorChips(trip.calendar);
      setPerson(trip.created_by || '');
      document.getElementById('colorHint').textContent = 'Click a color to save it right away.';
      showDayLog(null);
      document.getElementById('deleteBtn').style.display = 'block';
      document.getElementById('formError').innerHTML = '';
      document.getElementById('tripModal').classList.add('active');
    };

    // Clicking a day (or sweeping across several) opens Add; clicking a bar calls editTrip.
    window.openTripModal = (startStr = null, endStr = startStr) => {
      document.getElementById('modalTitle').textContent = 'Add';
      document.getElementById('tripForm').reset();
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('formError').innerHTML = '';
      selectedTrip = null;

      document.getElementById('tripCalendar').value = activeCalendar;
      renderColorChips(activeCalendar);
      setPerson('');
      document.getElementById('colorHint').textContent = 'Skip it and color it later.';
      showDayLog(startStr === endStr ? startStr : null);
      document.getElementById('modalTitle').textContent = document.getElementById('dayLog').dataset.day ? 'Add to calendar' : 'Add';
      if (startStr) {
        document.getElementById('tripStartDate').value = startStr;
        document.getElementById('tripEndDate').value = endStr;
      }

      document.getElementById('tripModal').classList.add('active');
      document.getElementById('tripName').focus();
    };

    function setPerson(person) {
      document.getElementById('tripPerson').value = person;
      document.querySelectorAll('#colorChips .chip').forEach(c =>
        c.classList.toggle('selected', c.dataset.person === person));
    }

    // Picking a color on an existing entry saves straight away, so coloring
    // something in later is two clicks: the bar, then the color.
    document.getElementById('colorChips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      setPerson(chip.dataset.person);
      if (selectedTrip) document.getElementById('tripForm').requestSubmit();
    });

    // Moving an entry to the other calendar swaps in that calendar's colors.
    // Its old color means nothing there, so it starts uncolored.
    document.getElementById('tripCalendar').addEventListener('change', (e) => {
      renderColorChips(e.target.value);
      setPerson('');
    });

    // Moving the start past the end drags the end along with it.
    document.getElementById('tripStartDate').addEventListener('change', (e) => {
      const end = document.getElementById('tripEndDate');
      if (!end.value || end.value < e.target.value) end.value = e.target.value;
    });

    // Press on a day and sweep across others to add a multi-day entry in one go.
    let pickStart = null;
    function markPicking(endStr) {
      const [lo, hi] = [pickStart, endStr].sort();
      document.querySelectorAll('.day').forEach(d =>
        d.classList.toggle('picking', d.dataset.date >= lo && d.dataset.date <= hi));
    }
    const calendarEl = document.getElementById('calendar');
    calendarEl.addEventListener('mousedown', (e) => {
      const day = e.target.closest('.day');
      if (!day || e.button !== 0) return;
      pickStart = day.dataset.date;
      markPicking(pickStart);
      e.preventDefault();
    });
    calendarEl.addEventListener('mouseover', (e) => {
      const day = e.target.closest('.day');
      if (pickStart && day) markPicking(day.dataset.date);
    });
    window.addEventListener('mouseup', (e) => {
      if (!pickStart) return;
      const day = e.target.closest && e.target.closest('.day');
      const [lo, hi] = [pickStart, day ? day.dataset.date : pickStart].sort();
      pickStart = null;
      document.querySelectorAll('.day.picking').forEach(d => d.classList.remove('picking'));
      openTripModal(lo, hi);
    });

    window.closeModal = () => {
      document.getElementById('tripModal').classList.remove('active');
    };

    window.saveTrip = async (event) => {
      event.preventDefault();

      const name = document.getElementById('tripName').value.trim();
      const startDate = document.getElementById('tripStartDate').value;
      const endDate = document.getElementById('tripEndDate').value;
      const createdBy = document.getElementById('tripPerson').value;
      const calendar = document.getElementById('tripCalendar').value;

      // With a day's log open, an empty name just means "done logging".
      if (!name && document.getElementById('dayLog').dataset.day) {
        closeModal();
        return;
      }

      if (!name || !startDate || !endDate) {
        document.getElementById('formError').innerHTML = '<div class="error">Add a name and dates.</div>';
        return;
      }

      if (startDate > endDate) {
        document.getElementById('formError').innerHTML = '<div class="error">Start date must be before end date</div>';
        return;
      }

      try {
        const db = getWriteClient();
        if (!db) {
          document.getElementById('formError').innerHTML = '<div class="error">An edit passphrase is required to change trips.</div>';
          return;
        }

        if (selectedTrip) {
          const { data, error } = await db
            .from('trips')
            .update({ name, start_date: startDate, end_date: endDate, created_by: createdBy || null, calendar })
            .eq('id', selectedTrip.id)
            .select();
          if (error) throw error;
          if (!data || data.length === 0) rejectBadKey();
          showMessage('Saved', 'success');
        } else {
          const { data, error } = await db
            .from('trips')
            .insert({ name, start_date: startDate, end_date: endDate, created_by: createdBy || null, calendar })
            .select();
          if (error) throw error;
          if (!data || data.length === 0) rejectBadKey();
          showMessage('Added', 'success');
        }

        await fetchTrips();
        renderCalendar();
        closeModal();
      } catch (error) {
        console.error('Error saving trip:', error);
        document.getElementById('formError').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    };

    window.deleteTrip = async () => {
      if (!selectedTrip || !confirm('Delete this trip?')) return;

      try {
        const db = getWriteClient();
        if (!db) {
          document.getElementById('formError').innerHTML = '<div class="error">An edit passphrase is required to delete trips.</div>';
          return;
        }

        const { data, error } = await db
          .from('trips')
          .delete()
          .eq('id', selectedTrip.id)
          .select();

        if (error) throw error;
        if (!data || data.length === 0) rejectBadKey();

        showMessage('Trip deleted!', 'success');
        await fetchTrips();
        renderCalendar();
        closeModal();
      } catch (error) {
        console.error('Error deleting trip:', error);
        document.getElementById('formError').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    };

    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => { msgDiv.innerHTML = ''; }, 4000);
    }

    window.addEventListener('click', (e) => {
      if (e.target.id === 'tripModal') closeModal();
    });

    // Esc closes the trip editor; the arrow keys move a week while it is closed.
    window.addEventListener('keydown', (e) => {
      const modalOpen = document.getElementById('tripModal').classList.contains('active');
      if (e.key === 'Escape' && modalOpen) closeModal();
      if (modalOpen || isMobile) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') previousMonth();
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') nextMonth();
    });

    markActiveTab();
    renderLegend();
    await Promise.all([fetchTrips(), fetchGoalLogs()]);
    renderGoals();
    renderCalendar();

    // Desktop: mouse wheel scrolls weeks (accumulate small deltas)
    if (!isMobile) {
      let accumulatedDelta = 0;
      const threshold = 80;
      document.querySelector('.calendar-wrapper').addEventListener('wheel', (e) => {
        e.preventDefault();
        accumulatedDelta += e.deltaY;
        if (Math.abs(accumulatedDelta) >= threshold) {
          if (accumulatedDelta > 0) {
            currentDate.setDate(currentDate.getDate() + 7);
          } else {
            currentDate.setDate(currentDate.getDate() - 7);
          }
          accumulatedDelta = 0;
          renderCalendar();
        }
      }, { passive: false });
    }

    // Mobile infinite scroll — load more weeks at top/bottom
    if (isMobile) {
      let scrollReady = false;
      let scrollDebounce = null;

      // Don't activate scroll loading until user has scrolled at least once
      setTimeout(() => { scrollReady = true; }, 1000);

      window.addEventListener('scroll', () => {
        if (!scrollReady || scrollDebounce) return;

        const scrollTop = window.scrollY;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = window.innerHeight;

        // Near bottom — add more future weeks
        if (scrollTop + clientHeight >= scrollHeight - 100) {
          scrollDebounce = true;
          mobileWeeksAfter += 4;
          renderCalendar();
          setTimeout(() => { scrollDebounce = false; }, 500);
        }

        // Near top — add more past weeks (only if user has scrolled down first)
        if (scrollTop <= 20 && mobileWeeksAfter > 8) {
          scrollDebounce = true;
          const oldHeight = document.documentElement.scrollHeight;
          mobileWeeksBefore += 4;
          renderCalendar();
          const newHeight = document.documentElement.scrollHeight;
          window.scrollTo(0, scrollTop + (newHeight - oldHeight));
          setTimeout(() => { scrollDebounce = false; }, 500);
        }
      });
    }

    setInterval(async () => {
      await Promise.all([fetchTrips(), fetchGoalLogs()]);
      renderGoals();
      renderCalendar();
    }, 30000);
  </script>
</body>
</html>
