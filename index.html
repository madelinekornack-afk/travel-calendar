<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Maddy & Phil In Love Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <style>
    /* Paper planner: cream paper, hairline rules, flat ink colours. */
    :root {
      --paper: #FBF8F3;
      --paper-dim: #F3EEE5;
      --line: #E6DFD3;
      --ink: #2E2A26;
      --ink-soft: #6F665B;
      --muted: #A39886;
      --madeline: #C8664A;
      --phil: #3F7F8C;
      --both: #7A5C99;
      --serif: 'Fraunces', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop: locked to viewport */
    @media (min-width: 769px) {
      body { height: 100vh; overflow: hidden; }
      .container { height: 100vh; overflow: hidden; }
    }

    .container {
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px 28px 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .header h1 .year { color: var(--muted); font-weight: 400; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .couple {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
    }

    .nav-buttons { display: flex; gap: 6px; }

    .nav-buttons button {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      height: 30px;
      min-width: 30px;
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-buttons button:hover { background: var(--paper-dim); color: var(--ink); }

    .calendar-wrapper {
      flex: 1;
      overflow: hidden;
      padding: 0 28px 4px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .month-view {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      flex-shrink: 0;
    }

    .weekday {
      text-align: left;
      padding: 0 8px 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mobile-weekday-bar { display: none; }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      flex: 1;
      min-height: 0;
      position: relative;
      border-top: 1px solid var(--line);
    }

    .week-grid:last-child { border-bottom: 1px solid var(--line); }

    .multi-day-event {
      position: absolute;
      height: 22px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      color: #fff;
      transition: filter 0.15s;
    }

    .multi-day-event:hover { filter: brightness(0.92); }

    .trip-badge.madeline { background: var(--madeline); }
    .trip-badge.fiance { background: var(--phil); }
    .trip-badge.both { background: var(--both); }

    .day {
      padding: 6px 8px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 50px;
      transition: background 0.15s;
    }

    .day ~ .day { border-left: 1px solid var(--line); }

    /* The month in the heading sits on the paper; the months either side are a shade darker. */
    .day.in-month { background: var(--paper); }
    .day.other-month { background: var(--paper-dim); }
    .day.other-month .day-number { color: var(--muted); }
    .day:hover { background: #F6EFE4; }

    .day-number {
      font-size: 13px;
      font-weight: 500;
      line-height: 22px;
      height: 22px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .day.today .day-number .num {
      background: var(--madeline);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: -4px;
    }

    .month-label {
      font-family: var(--serif);
      font-style: italic;
      font-size: 13px;
      font-weight: 500;
      color: var(--madeline);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(46, 42, 38, 0.35);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--paper);
      padding: 24px;
      border-radius: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(46, 42, 38, 0.18);
      width: 90%;
      max-width: 420px;
    }

    .modal-content h3 {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--ink-soft);
    }

    .form-buttons { display: flex; gap: 8px; margin-top: 18px; }

    .form-buttons button {
      flex: 1;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
    .btn-primary:hover { background: #47413B; }
    .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-secondary:hover { background: var(--paper-dim); }
    .btn-danger { background: transparent; color: #A33A2A; border: 1px solid #E5C2BA; }
    .btn-danger:hover { background: #F7E7E2; }

    .loading { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

    .error, .success {
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .error { background: #F7E7E2; color: #8A2E20; }
    .success { background: #E6EFE9; color: #2F5E46; }

    .legend {
      display: flex;
      gap: 18px;
      padding: 10px 28px 14px;
      align-items: center;
      font-size: 12px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
    .legend-swatch.madeline { background: var(--madeline); }
    .legend-swatch.fiance { background: var(--phil); }
    .legend-swatch.both { background: var(--both); }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
      }

      .container { height: auto; overflow: visible; display: block; }
      .header { display: none; }

      /* Fixed weekday bar on mobile */
      .mobile-weekday-bar {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }

      .mobile-weekday-bar .weekday { text-align: center; padding: 2px 0; font-size: 10px; }

      .calendar-wrapper {
        overflow: visible !important;
        flex: none !important;
        padding: 30px 0 0 !important;
        display: block;
        height: auto !important;
      }

      .month-view { height: auto !important; display: block; }
      .month-view .weekdays { display: none; }

      .week-grid {
        flex: none !important;
        min-height: auto !important;
        grid-auto-rows: 80px;
      }

      .multi-day-event {
        height: 18px !important;
        font-size: 10px !important;
        padding: 0 5px !important;
        border-radius: 3px;
      }

      .day { height: 80px; min-height: 80px; padding: 3px 4px; overflow: hidden; }
      .day-number { font-size: 12px; height: 18px; line-height: 18px; }
      .day.today .day-number .num { width: 18px; height: 18px; margin-left: -2px; }
      .month-label { font-size: 11px; }

      .legend { padding: 10px 12px 14px; gap: 12px; font-size: 11px; }
      .modal-content { width: 95%; padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="mobile-weekday-bar">
    <div class="weekday">Mon</div>
    <div class="weekday">Tue</div>
    <div class="weekday">Wed</div>
    <div class="weekday">Thu</div>
    <div class="weekday">Fri</div>
    <div class="weekday">Sat</div>
    <div class="weekday">Sun</div>
  </div>
  <div class="container">
    <div class="header">
      <h1 id="monthTitle"></h1>
      <div class="header-right">
        <span class="couple">Maddy &amp; Phil</span>
        <div class="nav-buttons">
          <button onclick="previousMonth()" aria-label="Previous week">←</button>
          <button onclick="currentMonth()">Today</button>
          <button onclick="nextMonth()" aria-label="Next week">→</button>
        </div>
      </div>
    </div>

    <div class="calendar-wrapper">
      <div id="message"></div>
      <div id="calendar" class="month-view">
        <div class="loading">Loading calendar...</div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch madeline"></div> Madeline</div>
      <div class="legend-item"><div class="legend-swatch fiance"></div> Phil</div>
      <div class="legend-item"><div class="legend-swatch both"></div> Both</div>
    </div>
  </div>

  <!-- Add/Edit Trip Modal -->
  <div id="tripModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Trip</h3>
      <form id="tripForm" onsubmit="saveTrip(event)">
        <div class="form-group">
          <label for="tripName">Trip Name / Destination *</label>
          <input type="text" id="tripName" required placeholder="e.g., Hawaii Vacation">
        </div>

        <div class="form-group">
          <label for="tripStartDate">Start Date *</label>
          <input type="date" id="tripStartDate" required>
        </div>

        <div class="form-group">
          <label for="tripEndDate">End Date *</label>
          <input type="date" id="tripEndDate" required>
        </div>

        <div class="form-group">
          <label for="tripPerson">Who's Going? *</label>
          <select id="tripPerson" required>
            <option value="">Select...</option>
            <option value="madeline">Madeline</option>
            <option value="fiance">Phil</option>
            <option value="both">Both of us</option>
          </select>
        </div>

        <div id="formError"></div>

        <div class="form-buttons">
          <button type="submit" class="btn-primary">Save Trip</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="button" id="deleteBtn" class="btn-danger" onclick="deleteTrip()" style="display: none;">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0/+esm';

    const SUPABASE_URL = 'https://lcfnmxufyipclcfpteqz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZm5teHVmeWlwY2xjZnB0ZXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODc1NjEsImV4cCI6MjA4Nzk2MzU2MX0.r-QcVdtX7gTVrKY3ue2OmMm13Nvh2rhvAN2nQ-Uhjv4';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Reading trips is public. Changing them is not: the RLS policies on `trips`
    // require an `x-trip-key` header matching the edit passphrase, so the anon key
    // on its own (which anyone can read off this page) can no longer add, edit or
    // delete anything. The passphrase is kept in this browser only.
    const TRIP_KEY_STORAGE = 'tripEditKey';
    let writeClient = null;
    let writeClientKey = null;

    function getWriteClient({ prompt = true } = {}) {
      let key = localStorage.getItem(TRIP_KEY_STORAGE);
      if (!key && prompt) {
        key = (window.prompt('Enter the edit passphrase to change trips:') || '').trim();
        if (!key) return null;
        localStorage.setItem(TRIP_KEY_STORAGE, key);
      }
      if (!key) return null;
      if (!writeClient || writeClientKey !== key) {
        writeClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: { headers: { 'x-trip-key': key } },
        });
        writeClientKey = key;
      }
      return writeClient;
    }

    // A wrong passphrase makes UPDATE and DELETE return 200 with zero rows rather
    // than an error, so every write asks for the affected rows back and treats an
    // empty result as a rejected passphrase instead of silently "succeeding".
    function rejectBadKey() {
      localStorage.removeItem(TRIP_KEY_STORAGE);
      writeClient = null;
      writeClientKey = null;
      throw new Error('That edit passphrase was not accepted. Try again.');
    }

    let currentDate = new Date();
    let trips = [];
    let selectedTrip = null;

    const mobileQuery = window.matchMedia('(max-width: 768px)');
    const isMobile = mobileQuery.matches;
    // The phone and desktop layouts set up different scroll handlers at load,
    // so reload when a resize or rotation crosses the breakpoint.
    mobileQuery.addEventListener('change', () => location.reload());

    window.previousMonth = () => {
      currentDate.setDate(currentDate.getDate() - 7);
      renderCalendar();
    };

    window.nextMonth = () => {
      currentDate.setDate(currentDate.getDate() + 7);
      renderCalendar();
    };

    window.currentMonth = () => {
      currentDate = new Date();
      renderCalendar();
    };

    async function fetchTrips() {
      try {
        const { data, error } = await supabase
          .from('trips')
          .select('*')
          .order('start_date', { ascending: true });

        if (error) throw error;
        trips = data || [];
      } catch (error) {
        console.error('Error fetching trips:', error);
        showMessage('Error loading trips: ' + error.message, 'error');
      }
    }

    // Trip names are typed by people, so escape them before they go into innerHTML.
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function toLocalDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Mobile infinite scroll state
    let mobileWeeksBefore = 0;
    let mobileWeeksAfter = 8;

    function renderCalendar() {
      const date = new Date(currentDate);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);

      const startDate = new Date(date.setDate(diff));

      // The heading names the month of the top week's Thursday, so the
      // label turns over once most of the top row is in the new month.
      const focusDay = new Date(startDate);
      focusDay.setDate(focusDay.getDate() + 3);
      const focusMonth = focusDay.getMonth();
      document.getElementById('monthTitle').innerHTML =
        `${focusDay.toLocaleDateString('en-US', { month: 'long' })} <span class="year">${focusDay.getFullYear()}</span>`;

      let weeksToShow, weeksBefore;
      if (isMobile) {
        weeksToShow = mobileWeeksBefore + mobileWeeksAfter;
        weeksBefore = mobileWeeksBefore;
        startDate.setDate(startDate.getDate() - weeksBefore * 7);
      } else {
        weeksToShow = 5;
        weeksBefore = 0;
      }


      let html = `

        <div class="weekdays">
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
          <div class="weekday">Sun</div>
        </div>
      `;

      for (let week = 0; week < weeksToShow; week++) {
        const weekStart = new Date(startDate);
        weekStart.setDate(weekStart.getDate() + week * 7);

        const seenIds = new Set();
        const weekMultiDay = [];
        for (let d = 0; d < 7; d++) {
          const dd = new Date(weekStart);
          dd.setDate(dd.getDate() + d);
          const ds = toLocalDateStr(dd);
          trips.forEach(trip => {
            const start = trip.start_date.split('T')[0];
            const end = trip.end_date.split('T')[0];
            if (ds >= start && ds <= end && !seenIds.has(trip.id)) {
              seenIds.add(trip.id);
              weekMultiDay.push(trip);
            }
          });
        }
        weekMultiDay.sort((a, b) => {
          const cmp = a.start_date.split('T')[0].localeCompare(b.start_date.split('T')[0]);
          if (cmp !== 0) return cmp;
          return b.end_date.split('T')[0].localeCompare(a.end_date.split('T')[0]);
        });

        html += `<div class="week-grid">`;

        const weekDays = [];
        for (let d = 0; d < 7; d++) {
          const wd = new Date(weekStart);
          wd.setDate(wd.getDate() + d);
          weekDays.push(toLocalDateStr(wd));
        }

        // Spanning bars for both desktop and mobile
        const barRows = [];
        const mobileRowH = 22;
        const desktopRowH = 28;
        weekMultiDay.forEach(trip => {
          const start = trip.start_date.split('T')[0];
          const end = trip.end_date.split('T')[0];
          let startOffset = weekDays.findIndex(d => d >= start);
          if (startOffset === -1) startOffset = 0;
          let endOffset = 6;
          for (let i = 6; i >= 0; i--) {
            if (weekDays[i] <= end) { endOffset = i; break; }
          }
          const daysShown = endOffset - startOffset + 1;

          let row = 0;
          while (true) {
            if (!barRows[row]) { barRows[row] = []; break; }
            const conflict = barRows[row].some(b => startOffset <= b.end && endOffset >= b.start);
            if (!conflict) break;
            row++;
          }
          barRows[row] = barRows[row] || [];
          barRows[row].push({ start: startOffset, end: endOffset });

          const rowH = isMobile ? mobileRowH : desktopRowH;
          const topPx = (isMobile ? 22 : 32) + row * rowH;
          const cellWidth = (100 / 7);
          const left = cellWidth * startOffset;
          const width = cellWidth * daysShown;

          html += `
            <div class="multi-day-event trip-badge ${trip.created_by}" style="left: calc(${left}% + 4px); width: calc(${width}% - 8px); top: ${topPx}px;" onclick="event.stopPropagation(); editTrip('${trip.id}')">
              ${escapeHtml(trip.name)}
            </div>
          `;
        });

        for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + dayOffset);
          const dateStr = toLocalDateStr(dayDate);

          const dayNum = dayDate.getDate();
          const today = new Date();
          const todayStr = toLocalDateStr(today);
          const isToday = dateStr === todayStr ? 'today' : '';
          const thisMonth = dayDate.getMonth();
          const monthClass = thisMonth === focusMonth ? 'in-month' : 'other-month';

          const monthLabel = dayNum === 1 ? dayDate.toLocaleDateString('en-US', { month: 'short' }) : '';

          html += `
            <div class="day ${isToday} ${monthClass}" data-date="${dateStr}" onclick="openTripModal('${dateStr}')">
              <div class="day-number">${monthLabel ? '<span class="month-label">' + monthLabel + '</span>' : ''}<span class="num">${dayNum}</span></div>
            </div>
          `;
        }
        html += `</div>`;
      }

      document.getElementById('calendar').innerHTML = html;
    }

    window.editTrip = (tripId) => {
      const trip = trips.find(t => t.id === tripId);
      if (!trip) return;

      selectedTrip = trip;
      document.getElementById('modalTitle').textContent = 'Edit Trip';
      document.getElementById('tripName').value = trip.name;
      document.getElementById('tripStartDate').value = trip.start_date.split('T')[0];
      document.getElementById('tripEndDate').value = trip.end_date.split('T')[0];
      document.getElementById('tripPerson').value = trip.created_by;
      document.getElementById('deleteBtn').style.display = 'block';
      document.getElementById('formError').innerHTML = '';
      document.getElementById('tripModal').classList.add('active');
    };

    window.openTripModal = (dateStr = null) => {
      // Always open Add Trip when clicking a day cell
      // Clicking a bar directly calls editTrip instead
      document.getElementById('modalTitle').textContent = 'Add Trip';
      document.getElementById('tripForm').reset();
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('formError').innerHTML = '';
      selectedTrip = null;

      if (dateStr) {
        document.getElementById('tripStartDate').value = dateStr;
        document.getElementById('tripEndDate').value = dateStr;
      }

      document.getElementById('tripModal').classList.add('active');
    };

    window.closeModal = () => {
      document.getElementById('tripModal').classList.remove('active');
    };

    window.saveTrip = async (event) => {
      event.preventDefault();

      const name = document.getElementById('tripName').value.trim();
      const startDate = document.getElementById('tripStartDate').value;
      const endDate = document.getElementById('tripEndDate').value;
      const createdBy = document.getElementById('tripPerson').value;

      if (!name || !startDate || !endDate || !createdBy) {
        document.getElementById('formError').innerHTML = '<div class="error">All fields are required</div>';
        return;
      }

      if (startDate > endDate) {
        document.getElementById('formError').innerHTML = '<div class="error">Start date must be before end date</div>';
        return;
      }

      try {
        const db = getWriteClient();
        if (!db) {
          document.getElementById('formError').innerHTML = '<div class="error">An edit passphrase is required to change trips.</div>';
          return;
        }

        if (selectedTrip) {
          const { data, error } = await db
            .from('trips')
            .update({ name, start_date: startDate, end_date: endDate, created_by: createdBy })
            .eq('id', selectedTrip.id)
            .select();
          if (error) throw error;
          if (!data || data.length === 0) rejectBadKey();
          showMessage('Trip updated!', 'success');
        } else {
          const { data, error } = await db
            .from('trips')
            .insert({ name, start_date: startDate, end_date: endDate, created_by: createdBy })
            .select();
          if (error) throw error;
          if (!data || data.length === 0) rejectBadKey();
          showMessage('Trip added!', 'success');
        }

        await fetchTrips();
        renderCalendar();
        closeModal();
      } catch (error) {
        console.error('Error saving trip:', error);
        document.getElementById('formError').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    };

    window.deleteTrip = async () => {
      if (!selectedTrip || !confirm('Delete this trip?')) return;

      try {
        const db = getWriteClient();
        if (!db) {
          document.getElementById('formError').innerHTML = '<div class="error">An edit passphrase is required to delete trips.</div>';
          return;
        }

        const { data, error } = await db
          .from('trips')
          .delete()
          .eq('id', selectedTrip.id)
          .select();

        if (error) throw error;
        if (!data || data.length === 0) rejectBadKey();

        showMessage('Trip deleted!', 'success');
        await fetchTrips();
        renderCalendar();
        closeModal();
      } catch (error) {
        console.error('Error deleting trip:', error);
        document.getElementById('formError').innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    };

    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => { msgDiv.innerHTML = ''; }, 4000);
    }

    window.addEventListener('click', (e) => {
      if (e.target.id === 'tripModal') closeModal();
    });

    // Esc closes the trip editor; the arrow keys move a week while it is closed.
    window.addEventListener('keydown', (e) => {
      const modalOpen = document.getElementById('tripModal').classList.contains('active');
      if (e.key === 'Escape' && modalOpen) closeModal();
      if (modalOpen || isMobile) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') previousMonth();
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') nextMonth();
    });

    await fetchTrips();
    renderCalendar();

    // Desktop: mouse wheel scrolls weeks (accumulate small deltas)
    if (!isMobile) {
      let accumulatedDelta = 0;
      const threshold = 80;
      document.querySelector('.calendar-wrapper').addEventListener('wheel', (e) => {
        e.preventDefault();
        accumulatedDelta += e.deltaY;
        if (Math.abs(accumulatedDelta) >= threshold) {
          if (accumulatedDelta > 0) {
            currentDate.setDate(currentDate.getDate() + 7);
          } else {
            currentDate.setDate(currentDate.getDate() - 7);
          }
          accumulatedDelta = 0;
          renderCalendar();
        }
      }, { passive: false });
    }

    // Mobile infinite scroll — load more weeks at top/bottom
    if (isMobile) {
      let scrollReady = false;
      let scrollDebounce = null;

      // Don't activate scroll loading until user has scrolled at least once
      setTimeout(() => { scrollReady = true; }, 1000);

      window.addEventListener('scroll', () => {
        if (!scrollReady || scrollDebounce) return;

        const scrollTop = window.scrollY;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = window.innerHeight;

        // Near bottom — add more future weeks
        if (scrollTop + clientHeight >= scrollHeight - 100) {
          scrollDebounce = true;
          mobileWeeksAfter += 4;
          renderCalendar();
          setTimeout(() => { scrollDebounce = false; }, 500);
        }

        // Near top — add more past weeks (only if user has scrolled down first)
        if (scrollTop <= 20 && mobileWeeksAfter > 8) {
          scrollDebounce = true;
          const oldHeight = document.documentElement.scrollHeight;
          mobileWeeksBefore += 4;
          renderCalendar();
          const newHeight = document.documentElement.scrollHeight;
          window.scrollTo(0, scrollTop + (newHeight - oldHeight));
          setTimeout(() => { scrollDebounce = false; }, 500);
        }
      });
    }

    setInterval(async () => {
      await fetchTrips();
      renderCalendar();
    }, 30000);
  </script>
</body>
</html>
